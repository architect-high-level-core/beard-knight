---
layout: default
---
{%- assign l = page.lang | default: site.lang | default: "en" -%}{%- assign t = site.data.i18n[l] -%}
<article>
<h1 class="post-title">{{ page.title }}</h1>
<p class="byline">{% include date.html date=page.date lang=l %}</p>
{% if page.image %}<figure class="header"><img class="header" src="{{ page.image | relative_url }}" alt="{{ page.image_alt | default: page.title }}">{% if page.image_credit %}<figcaption>{% if page.image_source_url %}<a href="{{ page.image_source_url }}" rel="nofollow noopener" target="_blank">{{ page.image_credit }}</a>{% else %}{{ page.image_credit }}{% endif %}{% if page.image_license %} · {{ t.license }} {% if page.image_license_url %}<a href="{{ page.image_license_url }}" rel="license">{{ page.image_license }}</a>{% else %}{{ page.image_license }}{% endif %}{% endif %}</figcaption>{% endif %}</figure>{% endif %}
<div class="post-body">
{{ content }}
</div>
<p class="back"><a href="{{ t.home | relative_url }}">{{ t.back }}</a></p>
</article>
